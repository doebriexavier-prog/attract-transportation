  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <aside>
    <div class="logo">ATTRACT<span>.</span><small>ADMIN PORTAL</small></div>
    <nav>
      <a href="index.html">▦ Dashboard</a>
      <a class="active" href="requests.html">◉ Ride Requests <b id="badge">0</b></a>

    <section class="view active">
      <div class="hero"><div><h1>Ride Requests</h1></div><button id="export">EXPORT CSV</button></div>

    </section>
  </main>
  <div id="modal" class="modal"><div class="modal-card"><button id="close" class="close-btn">×</button><div id="detail"></div></div></div>
